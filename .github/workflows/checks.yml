# Typecheck, lint, unit tests and the production build on every push and pull request (owner, 2026-11-19).
# Vercel deploys master on its own; a red check here means the deployed commit has a problem to fix.
name: checks

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # End-to-end flows (playwright.config.ts) against that build: no database, a throwaway /interno password.
      - run: npx playwright install --with-deps chromium
      - name: e2e
        env:
          E2E_PASSWORD: e2e-only-not-a-real-password
        run: |
          node scripts/interno-hash.mjs "$E2E_PASSWORD" > .env.production.local
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
